pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Handy"

// R2 — Gradle module split
// Each module compiles independently; incremental builds only rebuild affected modules.
// Dependency graph: util ← tracking ← depth ← scanner ← mocap ← render ← export ← app
include ':app'
include ':util'
include ':tracking'
include ':depth'
include ':scanner'
include ':mocap'
include ':render'
include ':export'
include ':camera'

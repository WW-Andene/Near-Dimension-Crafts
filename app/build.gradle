plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arhand'
    compileSdk 34

    defaultConfig {
        applicationId "com.arhand"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Item 4 — SMPL/BODY-8 feature flag.
        // Set to true only for internal research builds — the BODY-8 model weights
        // (if added) carry a non-commercial research licence and must not ship in
        // paid distribution. Keep false for all public / Play Store builds.
        buildConfigField "boolean", "FEATURE_SMPL_BODY", "false"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true   // Item 4 — needed for FEATURE_SMPL_BODY flag
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    // R2 — All library modules
    implementation project(':util')
    implementation project(':tracking')
    implementation project(':depth')
    implementation project(':scanner')
    implementation project(':mocap')
    implementation project(':render')
    implementation project(':export')
    implementation project(':camera')

    // AppCompat — required for theme base
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Core — required for FileProvider
    implementation 'androidx.core:core-ktx:1.13.1'

    // MediaPipe Tasks Vision — hand tracking, offline
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // ARCore
    implementation 'com.google.ar:core:1.42.0'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Lifecycle + ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.0'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // CameraX — matches version in camera module
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.24'
}

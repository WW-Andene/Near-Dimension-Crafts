plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.neardimension.handy'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.neardimension.handy"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName "1.0"

        // SMPL/BODY-8 feature flag.
        // Set to true only for internal research builds — the BODY-8 model weights
        // (if added) carry a non-commercial research licence and must not ship in
        // paid distribution. Keep false for all public / Play Store builds.
        buildConfigField "boolean", "FEATURE_SMPL_BODY", "false"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true   // needed for FEATURE_SMPL_BODY
    }
}

dependencies {
    implementation project(':util')
    implementation project(':tracking')
    implementation project(':depth')
    implementation project(':scanner')
    implementation project(':mocap')
    implementation project(':render')
    implementation project(':export')
    implementation project(':camera')

    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx       // FileProvider
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.datastore.preferences
    implementation libs.kotlinx.coroutines.android

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.animation

    implementation libs.mediapipe.tasks.vision
    implementation libs.arcore
    implementation libs.camerax.core
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle

    testImplementation libs.junit
    testImplementation libs.kotlin.test
}
